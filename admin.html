<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GRINGA.EXE // CONTROL</title>

    <link
        rel="stylesheet"
        href="css/estilo.css"
    >

    <link
        rel="icon"
        href="img/logo1.png"
    >

</head>

<body class="admin-body">

<div class="scanlines"></div>

<header>

    <div class="admin-brand">

        <img
            src="img/logo1.png"
            alt="GRINGA.EXE"
        >

        <div>

            <strong>
                GRINGA.EXE
            </strong>

            <span>
                ORDER CONTROL // v1.0
            </span>

        </div>

    </div>

    <div class="admin-live">

        <span class="live-dot"></span>

        LIVE ORDER QUEUE

    </div>

    <div id="conexion">
        🟢 Conectando...
    </div>

</header>

<main>

    <section class="admin-intro">

        <h2>
            PANEL DE PEDIDOS
        </h2>

        <p>
            Centro de control para gestionar,
            preparar y entregar pedidos.
        </p>

        <div class="admin-legend">

            <span class="legend-pendiente">
                PENDIENTE
            </span>

            <span class="legend-preparando">
                PREPARANDO
            </span>

            <span class="legend-listo">
                LISTO
            </span>

            <span class="legend-entregado">
                ENTREGADO
            </span>

        </div>

    </section>

    <section id="contenedor-pedidos">

        <div class="sin-pedidos">
            CARGANDO PEDIDOS...
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/admin.js"></script>

</body>
</html>

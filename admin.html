<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GRINGA.EXE | Pedidos</title>


    <!-- ========================================
         SUPABASE
    ======================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        /* ========================================
           RESET
        ======================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        /* ========================================
           BODY
        ======================================== */

        body {

            background: #000;

            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

        }


        /* ========================================
           HEADER
        ======================================== */

        header {

            background: #000;

            border-bottom:
                3px solid #ffd900;

            padding: 20px;

            text-align: center;

            position: sticky;

            top: 0;

            z-index: 10;

        }


        header h1 {

            color: #ffd900;

            font-size: 28px;

            text-shadow:
                3px 3px 0 #9c8500;

        }


        header p {

            margin-top: 8px;

            color: #aaa;

            font-size: 14px;

        }


        /* ========================================
           INDICADOR DE CONEXIÓN
        ======================================== */

        #conexion {

            margin-top: 10px;

            font-size: 13px;

            color: #55ff55;

        }


        /* ========================================
           CONTENEDOR
        ======================================== */

        #contenedor-pedidos {

            width: 100%;

            max-width: 700px;

            margin: auto;

            padding: 20px;

        }


        /* ========================================
           TARJETA PEDIDO
        ======================================== */

        .pedido {

            background: #111;

            border:
                2px solid #ffd900;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 18px;

            box-shadow:
                0 0 10px
                rgba(255, 217, 0, 0.25);

        }


        /* ========================================
           HEADER DEL PEDIDO
        ======================================== */

        .pedido-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 15px;

        }


        .numero {

            color: #ffd900;

            font-size: 22px;

            font-weight: bold;

        }


        /* ========================================
           ESTADO
        ======================================== */

        .estado {

            padding: 6px 10px;

            border-radius: 20px;

            background: #9b6500;

            color: #fff;

            font-size: 13px;

            font-weight: bold;

            text-transform: uppercase;

        }


        /* ========================================
           CLIENTE
        ======================================== */

        .cliente {

            margin-bottom: 15px;

            color: #ddd;

            font-size: 15px;

        }


        /* ========================================
           PRODUCTOS
        ======================================== */

        .producto {

            padding: 10px 0;

            border-bottom:
                1px solid #333;

        }


        .producto:last-child {

            border-bottom: none;

        }


        .producto-nombre {

            font-weight: bold;

            color: #fff;

            font-size: 16px;

        }


        .producto-detalle {

            color: #aaa;

            font-size: 14px;

            margin-top: 5px;

            line-height: 1.5;

        }


        /* ========================================
           TOTAL
        ======================================== */

        .total {

            margin-top: 15px;

            padding-top: 12px;

            border-top:
                2px solid #333;

            color: #ffd900;

            font-size: 20px;

            font-weight: bold;

            text-align: right;

        }


        /* ========================================
           PAGO
        ======================================== */

        .pago {

            margin-top: 8px;

            color: #aaa;

            text-align: right;

            font-size: 14px;

        }


        /* ========================================
           SIN PEDIDOS
        ======================================== */

        .sin-pedidos {

            text-align: center;

            color: #777;

            padding: 60px 20px;

            font-size: 16px;

        }


        /* ========================================
           ERROR
        ======================================== */

        .error {

            color: #ff5555;

        }


        /* ========================================
           RESPONSIVE
        ======================================== */

        @media (max-width: 500px) {

            #contenedor-pedidos {

                padding: 12px;

            }


            .pedido {

                padding: 15px;

            }


            .pedido-header {

                align-items: flex-start;

            }


            .numero {

                font-size: 20px;

            }


            .estado {

                font-size: 11px;

            }

        }

    </style>

</head>


<body>


    <!-- ========================================
         HEADER
    ======================================== -->

    <header>

        <h1>👻 GRINGA.EXE</h1>

        <p>PANEL DE PEDIDOS</p>

        <div id="conexion">

            🟢 Conectando...

        </div>

    </header>


    <!-- ========================================
         CONTENEDOR DE PEDIDOS
    ======================================== -->

    <main id="contenedor-pedidos">

        <div class="sin-pedidos">

            Cargando pedidos...

        </div>

    </main>


    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script>


        // ========================================
        // CONFIGURACIÓN SUPABASE
        // ========================================

        const SUPABASE_URL =
            "https://gbrqwiucxwqzflzxtupf.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_jW0Tc-8Ij0klXATVMNBFAQ_z3hOqZTz";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ========================================
        // ELEMENTOS
        // ========================================

        const contenedor =
            document.getElementById(
                "contenedor-pedidos"
            );


        const conexion =
            document.getElementById(
                "conexion"
            );


        // ========================================
        // CARGAR PEDIDOS
        // ========================================

        async function cargarPedidos() {


            try {


                // ========================================
                // CONSULTAR SUPABASE
                // ========================================

                const resultado =
                    await supabaseClient

                        .from("pedidos")

                        .select("*")

                        .order(
                            "id",
                            {
                                ascending: false
                            }
                        );


                const data =
                    resultado.data;


                const error =
                    resultado.error;


                // ========================================
                // ERROR
                // ========================================

                if (error) {


                    console.error(
                        "Error cargando pedidos:",
                        error
                    );


                    conexion.textContent =
                        "🔴 Error de conexión";


                    conexion.style.color =
                        "#ff5555";


                    contenedor.innerHTML = `

                        <div class="sin-pedidos error">

                            ❌ No se pudieron cargar
                            los pedidos.

                        </div>

                    `;


                    return;

                }


                // ========================================
                // CONEXIÓN CORRECTA
                // ========================================

                conexion.textContent =
                    "🟢 Conectado";


                conexion.style.color =
                    "#55ff55";


                // ========================================
                // SIN PEDIDOS
                // ========================================

                if (
                    !data ||
                    data.length === 0
                ) {


                    contenedor.innerHTML = `

                        <div class="sin-pedidos">

                            🟡 No hay pedidos todavía.

                        </div>

                    `;


                    return;

                }


                // ========================================
                // CREAR HTML
                // ========================================

                let pedidosHTML = "";


                data.forEach(
                    function (pedido) {


                        let productosHTML = "";


                        // ========================================
                        // PRODUCTOS
                        // ========================================

                        if (
                            Array.isArray(
                                pedido.productos
                            )
                        ) {


                            pedido.productos.forEach(
                                function (producto) {


                                    let detalles = "";


                                    // ========================================
                                    // SALSAS
                                    // ========================================

                                    if (
                                        Array.isArray(
                                            producto.salsas
                                        ) &&
                                        producto.salsas.length > 0
                                    ) {


                                        detalles +=
                                            "🌶️ " +
                                            producto.salsas.join(
                                                ", "
                                            );

                                    }


                                    // ========================================
                                    // EXTRA QUESO
                                    // ========================================

                                    if (
                                        producto.extraQueso
                                    ) {


                                        if (
                                            detalles !== ""
                                        ) {

                                            detalles +=
                                                " • ";

                                        }


                                        detalles +=
                                            "🧀 Extra queso";

                                    }


                                    // ========================================
                                    // EXTRA SALSA
                                    // ========================================

                                    if (
                                        producto.extraSalsa
                                    ) {


                                        if (
                                            detalles !== ""
                                        ) {

                                            detalles +=
                                                " • ";

                                        }


                                        detalles +=
                                            "➕ Extra salsa";

                                    }


                                    // ========================================
                                    // SI NO HAY DETALLES
                                    // ========================================

                                    if (
                                        detalles === ""
                                    ) {

                                        detalles =
                                            "Sin modificaciones";

                                    }


                                    // ========================================
                                    // HTML PRODUCTO
                                    // ========================================

                                    productosHTML += `

                                        <div class="producto">

                                            <div class="producto-nombre">

                                                ${producto.cantidad || 1}x
                                                ${producto.nombre || "Producto"}

                                            </div>


                                            <div class="producto-detalle">

                                                ${detalles}

                                            </div>

                                        </div>

                                    `;

                                }
                            );

                        }


                        // ========================================
                        // FECHA
                        // ========================================

                        let fecha =
                            "Sin fecha";


                        if (
                            pedido.fecha
                        ) {


                            fecha =
                                new Date(
                                    pedido.fecha
                                ).toLocaleString(
                                    "es-SV"
                                );

                        }


                        // ========================================
                        // MÉTODO DE PAGO
                        // ========================================

                        const metodoPago =
                            pedido.metodo_pago ||
                            "No especificado";


                        // ========================================
                        // CLIENTE
                        // ========================================

                        const cliente =
                            pedido.cliente ||
                            "Cliente";


                        // ========================================
                        // ESTADO
                        // ========================================

                        const estado =
                            pedido.estado ||
                            "Pendiente";


                        // ========================================
                        // TOTAL
                        // ========================================

                        const total =
                            Number(
                                pedido.total || 0
                            ).toFixed(2);


                        // ========================================
                        // PEDIDO COMPLETO
                        // ========================================

                        pedidosHTML += `

                            <div class="pedido">


                                <div class="pedido-header">


                                    <div class="numero">

                                        #${pedido.numero_pedido}

                                    </div>


                                    <div class="estado">

                                        ${estado}

                                    </div>


                                </div>


                                <div class="cliente">

                                    👤 ${cliente}

                                </div>


                                <div>

                                    ${productosHTML}

                                </div>


                                <div class="total">

                                    Total:
                                    $${total}

                                </div>


                                <div class="pago">

                                    💳 ${metodoPago}

                                </div>


                                <div class="pago">

                                    🕐 ${fecha}

                                </div>


                            </div>

                        `;

                    }
                );


                // ========================================
                // MOSTRAR PEDIDOS
                // ========================================

                contenedor.innerHTML =
                    pedidosHTML;


            }


            catch (error) {


                console.error(
                    "Error inesperado:",
                    error
                );


                conexion.textContent =
                    "🔴 Error";


                conexion.style.color =
                    "#ff5555";

            }

        }


        // ========================================
        // PRIMERA CARGA
        // ========================================

        cargarPedidos();


        // ========================================
        // ACTUALIZACIÓN AUTOMÁTICA
        // CADA 5 SEGUNDOS
        // ========================================

        setInterval(
            function () {

                cargarPedidos();

            },
            5000
        );


    </script>


</body>

</html>
